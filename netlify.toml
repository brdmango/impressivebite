# Netlify configuration for impressivebite.com
#
# The repo root IS the site — there is no build step, so `publish = "."` and
# an empty build command. 404.html is picked up automatically by Netlify.

[build]
  publish = "."
  command = ""

# --- Security headers -------------------------------------------------------
# The CSP is deliberately strict: the site loads nothing from third parties, so
# there is no reason to allow any external origin.
#
#   script-src  'self' + a sha256 hash of the one inline snippet in <head>
#               (document.documentElement.classList.add("js")). If you edit that
#               snippet — even by a character — recompute the hash or the script
#               is blocked and the reveal animations stop hiding/showing content.
#   style-src   needs 'unsafe-inline' because the pages use style="" attributes.
#               Inline style attributes cannot be hashed.
#   form-action 'self' — Netlify Forms posts back to this same origin.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- Caching ----------------------------------------------------------------
# Asset filenames are not content-hashed, so they cannot be cached immutably —
# a CSS change would not reach visitors. One day, with revalidation, is the
# safe ceiling. HTML always revalidates so copy edits go live immediately.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
